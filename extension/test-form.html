<!doctype html><html lang="en"><meta charset="utf-8"><title>ApplyWeave local test form</title>
<body style="font:16px system-ui;max-width:520px;margin:40px auto"><h1>Sample company application</h1>
<p>For local extension testing only. This form has no submit handler.</p>
<form onsubmit="event.preventDefault()">
<p><label>Full name <input name="full_name"></label></p><p><label>Email address <input type="email" name="email"></label></p>
<p><label>Phone number <input type="tel" name="phone"></label></p><p><label>LinkedIn profile <input type="url" name="linkedin"></label></p>
<p><label>Expected salary <input name="salary"></label></p><p><label>Why this role? <textarea name="motivation"></textarea></label></p>
<p><button type="submit">Sample submit (disabled)</button></p>
</form></body></html>
